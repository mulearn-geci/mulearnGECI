name: Daily Leaderboard Sync Bot

on:
  schedule:
    # Runs once a day at 12:00 AM IST (18:30 UTC)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  sync-leaderboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Playwright & Browsers
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Execute Automated Sync Bot
        env:
          MULEARN_EMAIL: ${{ secrets.MULEARN_EMAIL || 'mulearn@gecidukki.ac.in' }}
          MULEARN_PASSWORD: ${{ secrets.MULEARN_PASSWORD || 'gecimulearn@000' }}
          LEADERBOARD_SYNC_SECRET: ${{ secrets.LEADERBOARD_SYNC_SECRET || 'mulearn-geci-sync-secret-2026' }}
          BACKEND_API_URL: 'https://mulearn-geci-mu.vercel.app/api/leaderboard/sync'
        run: node scripts/sync-leaderboard.js
